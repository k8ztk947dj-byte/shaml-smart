<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شمل الذكية</title>
<style>
body{margin:0;background:#f4f0e6;font-family:Arial;color:#17345d}
header{background:#17345d;color:white;text-align:center;padding:30px 12px}
main{padding:20px;max-width:500px;margin:auto}
.card{background:white;padding:20px;margin:15px 0;border-radius:16px;box-shadow:0 2px 8px #0001}
button{background:#d8ac50;color:#17345d;border:0;padding:13px;border-radius:10px;width:100%;font-weight:bold;margin:6px 0}
</style>
</head>
<body>
<header><h1>🏫 شمل الذكية</h1><p>مدرسة شمل | الإمارات 🇦🇪</p></header>
<main>
<h2>مرحباً بك 👋</h2>
<div class="card"><h3>📚 الواجبات</h3><p>تابع واجباتك المدرسية</p><button onclick="alert('قسم الواجبات قيد التطوير')">عرض الواجبات</button></div>
<div class="card"><h3>📅 جدول الحصص</h3><p>جدولك الأسبوعي</p><button onclick="alert('قسم الجدول قيد التطوير')">عرض الجدول</button></div>
<div class="card"><h3>👨‍👩‍👧 ولي الأمر</h3><p>متابعة الأبناء والتواصل مع المعلمين</p><button onclick="alert('حساب ولي الأمر قيد التطوير')">دخول ولي الأمر</button></div>
<div class="card"><h3>👨‍🏫 المعلم</h3><p>إدارة الواجبات والاختبارات</p><button onclick="alert('حساب المعلم قيد التطوير')">دخول المعلم</button></div>
</main>
</body>
</html>
